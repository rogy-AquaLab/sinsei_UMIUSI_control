name: Main CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read
  packages: read

jobs:
  parse-env-file:
    name: Parse Environment
    runs-on: ubuntu-latest
    outputs:
      PACKAGE_NAME: ${{ steps.parse-env-file.outputs.PACKAGE_NAME }}
      ROS_DISTRO: ${{ steps.parse-env-file.outputs.ROS_DISTRO }}
      file-hash: ${{ steps.hash-files.outputs.hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse environment file
        id: parse-env-file
        shell: bash
        run: source .github/workflows/scripts/parse-env-file.sh $GITHUB_OUTPUT || exit 0

      - name: Hash files for cache key
        id: hash-files
        run: echo "hash=${{ hashFiles('**/*.cpp', '**/*.hpp', '**/*.py') }}" >> "$GITHUB_OUTPUT"

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

      - name: Ruff Check
        run: ruff check

      - name: Ruff Format
        run: ruff format --check --diff

  editorconfig-check:
    name: EditorConfig Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 最近のバージョンのタグがないためコミットIDを指定
      - uses: editorconfig-checker/action-editorconfig-checker@48920075d6a466d902d683b648b6365703e49293

      - name: EditorConfig Check
        run: editorconfig-checker

  colcon-build:
    name: Colcon Build
    needs: parse-env-file
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rogy-aqualab/sinsei_umiusi_control:${{ needs.parse-env-file.outputs.ROS_DISTRO }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch cache
        uses: actions/cache@v4
        env:
          prefix: ${{ runner.os }}-sccache-ros-${{ needs.parse-env-file.outputs.ROS_DISTRO }}-ci
        with:
          path: /github/home/.cache/sccache
          key: ${{ env.prefix }}-${{ needs.parse-env-file.outputs.file-hash }}
          restore-keys: ${{ env.prefix }}-

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.7.7" # sccache version as apt package

      - name: Prepare ROS workspace
        run: |
          rm -rf /home/ubuntu/ros_ws/src/pkg
          ln -s "$GITHUB_WORKSPACE" /home/ubuntu/ros_ws/src/pkg

      - name: Colcon Build
        working-directory: /home/ubuntu/ros_ws
        shell: bash
        run: |
          source /opt/ros/${{ needs.parse-env-file.outputs.ROS_DISTRO }}/setup.bash
          colcon build \
            --packages-up-to "${{ needs.parse-env-file.outputs.PACKAGE_NAME }}" \
            --symlink-install \
            --event-handlers console_direct+

      - name: Archive Build results
        run: |
          tar -C /home/ubuntu/ros_ws -czf /home/ubuntu/ros_ws/colcon-build-results.tar.gz \
            build install

      - name: Archive ROS C++ libraries
        run: |
          tar -C /opt/ros/${{ needs.parse-env-file.outputs.ROS_DISTRO }} \
            -czf /home/ubuntu/ros_ws/ros-cpp-libraries.tar.gz include src

      - name: Upload Build results
        uses: actions/upload-artifact@v4
        with:
          name: colcon-build-results
          path: /home/ubuntu/ros_ws/colcon-build-results.tar.gz

      - name: Upload ROS C++ libraries
        uses: actions/upload-artifact@v4
        with:
          name: ros-cpp-libraries
          path: /home/ubuntu/ros_ws/ros-cpp-libraries.tar.gz

  cpp-lint:
    name: C++ Lint
    needs: [parse-env-file, colcon-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgpiod-dev \
            libgstreamermm-1.0-dev

      - name: Download Build results
        uses: actions/download-artifact@v4
        with:
          name: colcon-build-results
          path: ${{ github.workspace }}

      - name: Download ROS C++ libraries
        uses: actions/download-artifact@v4
        with:
          name: ros-cpp-libraries
          path: ${{ github.workspace }}

      - name: Extract Build results
        run: |
          rm -rf build install
          tar -C "$GITHUB_WORKSPACE" -xzf "$GITHUB_WORKSPACE/colcon-build-results.tar.gz"

      - name: Extract ROS C++ libraries
        run: |
          rm -rf "$GITHUB_WORKSPACE/opt_ros"
          mkdir -p "$GITHUB_WORKSPACE/opt_ros/${{ needs.parse-env-file.outputs.ROS_DISTRO }}"
          tar -C "$GITHUB_WORKSPACE/opt_ros/${{ needs.parse-env-file.outputs.ROS_DISTRO }}" \
            -xzf "$GITHUB_WORKSPACE/ros-cpp-libraries.tar.gz"

      - name: Rewrite compile_commands.json paths
        run: |
          if [ -f build/compile_commands.json ]; then
            sed -i "s|/home/ubuntu/ros_ws/src/pkg|$GITHUB_WORKSPACE|g" build/compile_commands.json
            sed -i "s|/home/ubuntu/ros_ws/build|$GITHUB_WORKSPACE/build|g" build/compile_commands.json
            sed -i "s|/home/ubuntu/ros_ws/install|$GITHUB_WORKSPACE/install|g" build/compile_commands.json
            sed -i "s|/opt/ros/${{ needs.parse-env-file.outputs.ROS_DISTRO }}|$GITHUB_WORKSPACE/opt_ros/${{ needs.parse-env-file.outputs.ROS_DISTRO }}|g" build/compile_commands.json
            echo "Fixed working directory paths in compile_commands.json"
          fi

      - name: C++ Lint
        id: cpp-lint
        uses: cpp-linter/cpp-linter-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          verbosity: debug
          version: 18
          style: file
          tidy-checks: ""
          database: build
          ignore: ./.github | ./build
          step-summary: true
          files-changed-only: false

      - name: Check C++ Lint result
        if: steps.cpp-lint.outputs.checks-failed > 0
        run: echo "C++ lint checks failed ... ${{ steps.cpp-lint.outputs.checks-failed }}" && exit 1

  colcon-test:
    name: Colcon Test
    needs: [parse-env-file, colcon-build]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rogy-aqualab/sinsei_umiusi_control:${{ needs.parse-env-file.outputs.ROS_DISTRO }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build results
        uses: actions/download-artifact@v4
        with:
          name: colcon-build-results
          path: /home/ubuntu/ros_ws

      - name: Prepare ROS workspace
        run: |
          rm -rf /home/ubuntu/ros_ws/src/pkg
          ln -s "$GITHUB_WORKSPACE" /home/ubuntu/ros_ws/src/pkg

      - name: Extract Build results
        run: |
          rm -rf /home/ubuntu/ros_ws/build /home/ubuntu/ros_ws/install
          tar -C /home/ubuntu/ros_ws -xzf /home/ubuntu/ros_ws/colcon-build-results.tar.gz

      - name: Colcon Test
        working-directory: /home/ubuntu/ros_ws
        shell: bash
        run: |
          source /home/ubuntu/ros_ws/install/setup.bash
          colcon test \
            --packages-select "${{ needs.parse-env-file.outputs.PACKAGE_NAME }}" \
            --event-handlers console_direct+

      - name: Colcon Test Result
        working-directory: /home/ubuntu/ros_ws
        if: always()
        run: colcon test-result --verbose
