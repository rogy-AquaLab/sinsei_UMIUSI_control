launch:
  - let:
      name: pkg_name
      value: "sinsei_umiusi_control"
  - let:
      name: ros2_control_common
      value: "$(find-pkg-share $(var pkg_name))/launch/include/alexandrite_ros2_control.py"

  - arg:
      name: args
      description: "Path to the Alexandrite launch arguments file"
      default: "$(find-pkg-share $(var pkg_name))/params/alexandrite_launch_args.yaml"

  - include:
      file: "$(var args)"

  - group:
    - push_ros_namespace:
        namespace: "$(var namespace)"

    - include:
        file: "$(var ros2_control_common)"

    - node:
        pkg: "controller_manager"
        exec: "spawner"
        args: |
          alexandrite_controller
          ballast_controller
          --param-file $(var controllers_param_file)

    # UMIUSIと同じ2台のカメラ。RTSPサーバ（MediaMTX）は別途起動しておく
    - node:
        pkg: "$(var pkg_name)"
        exec: "gst_camera_node"
        name: "pi_camera"
        if: "$(var enable_cameras)"
        param:
        - from: "$(var cameras_param_file)"
    - node:
        pkg: "$(var pkg_name)"
        exec: "gst_camera_node"
        name: "usb_camera"
        if: "$(var enable_cameras)"
        param:
        - from: "$(var cameras_param_file)"

    # UIと接続するため（UMIUSIではsinsei_umiusi_coreが起動している）
    - node:
        pkg: "rosbridge_server"
        exec: "rosbridge_websocket"
        if: "$(var enable_rosbridge)"
