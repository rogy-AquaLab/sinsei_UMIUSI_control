/**:
  controller_manager:
    ros__parameters:
      update_rate: 100 # Hz

  alexandrite_controller:
    ros__parameters:
      type: sinsei_umiusi_control/controller/AlexandriteController
      update_rate: 50 # Hz; CAN送信はCanModelがMotorとServoを周期ごとに交互に行う
      command_timeout: 0.5 # 秒。この時間、新しい指令が来なければ対象アクチュエータを停止
      max_duty: 0.5 # スラスタの絶対Duty上限
      crawler_max_duty: 0.5 # クローラーへの入力1.0に対応するDuty
      rear_thruster_reversed: false # 後部スラスタの正Duty方向が-yの場合はtrue
      target_topic: cmd/target # UMIUSIと共通のスラスタ目標値
      crawler_target_topic: cmd/crawler_target # クローラー専用目標値
      runnable_topic: cmd/thruster_runnable_all # UMIUSIと共通の運転許可

  ballast_controller:
    ros__parameters:
      type: sinsei_umiusi_control/controller/BallastController
      update_rate: 10 # Hz; ドライバ基板の状態送信周期（100 ms）に合わせる
      command_topic_prefix: cmd/ # cmd/ballast{1,2}/target, cmd/ballast{1,2}/calibrate
      state_topic_prefix: state/ # state/ballast{1,2}/position, state, fault_reason

  bms_controller:
    ros__parameters:
      type: sinsei_umiusi_control/controller/BmsController
      update_rate: 10 # Hz
      state_topic_prefix: state/ # state/power/battery, state/power/bms（UMIUSIのgate_controllerと同じ）
