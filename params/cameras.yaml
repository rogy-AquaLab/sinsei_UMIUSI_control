# 前カメラ (pi_camera) のピントは固定 (lens-position = 1/距離[m]、1.0 = 1 m)。
# 連続 AF (af-mode=continuous) は水中でピントを探し続け、認識が乱れる (2026-10-15)。
# ホワイトバランス: 手で固定 (awb-enable=false colour-gains="<赤,青>")。libcamera の自動は水中で数秒ごとに
# 真っ青 (赤ほぼ 0) へ飛ぶ (2026-10-17)。自動に戻すときは awb-enable 以降を消す
#   * 2.7,1.45 = imx708 の調整表の 7400 K 付近。10/17 の自動の「緑」のとき (認識はふつう) に近いはず [未確認]。真っ青は 2500 K (1.15,3.84)
#   * 調整: core の scripts/field/awb_probe.sh (control を止めて、同じ書き方を gst-launch で試す)
#   * colour-gains は awb-enable=false のときだけ効く (libcamera の ColourGains)
#   * Pi の libcamerasrc にこのプロパティが無いとパイプライン全体が止まる (RTSP = UI の映像も止まる)。
#     先に gst-inspect-1.0 libcamerasrc | grep -E 'awb|colour' で確かめる。書き換えたら UI の映像を必ず確かめる
/**:
  pi_camera:
    ros__parameters:
      pipeline: >-
        libcamerasrc af-mode=manual lens-position=1.0 awb-enable=false colour-gains="<2.7,1.45>" !
        video/x-raw,width=1280,height=720,framerate=30/1 !
        videoconvert !
        v4l2h264enc extra-controls="controls,video_bitrate=3000000,h264_i_frame_period=30" !
        video/x-h264,level=(string)4,profile=main !
        h264parse config-interval=1 !
        queue max-size-buffers=100 !
        rtspclientsink location=rtsp://localhost:8554/cam1

  usb_camera:
    ros__parameters:
      pipeline: >-
        v4l2src device=/dev/v4l/by-id/usb-H264_USB_Camera_H264_USB_Camera_2020032801-video-index2 !
        video/x-h264,width=1280,height=720,framerate=30/1 !
        h264parse config-interval=1 !
        queue max-size-buffers=100 !
        rtspclientsink location=rtsp://localhost:8554/cam2
