/**:
  controller_manager:
    ros__parameters:
      update_rate: 100 # Hz

  gate_controller:
    ros__parameters:
      type: sinsei_umiusi_control/controller/GateController
      update_rate: 50 # Hz

  attitude_controller:
    ros__parameters:
      type: sinsei_umiusi_control/controller/AttitudeController
      update_rate: 50 # Hz
      control_mode: "ff" # Control mode (ff: feedforward / fb: feedback / rl: learned policy)
      # `rl` のときだけ使う (既定は ff なので他モードには影響しない)。
      # libtorch 無しでビルドした場合、rl は on_configure で拒否される。
      rl:
        model_name: "av_mode13" # models/<name>/ に同梱したバンドル (models/README.md)
        model_path: "" # 同梱していないものを使うときだけ deploy.pt のフルパスを直接指定
        golden_path: "" # 空なら model_path と同じ場所の golden.pt を探す
        max_duty: 0.25 # duty の絶対値上限。力は 2 乗で効く (0.2 -> 0.4 は 4 倍)
        servo_range_deg: 90.0 # 方策の servo 出力 ±1 が当たる角度。契約と一致していないと起動しない
        servo_slew_deg_per_s: 250.0 # サーボの指令レート制限。下流に制限が無いのでここが唯一
        # esc は下流の thruster_controller_*/max_duty_step_per_sec でも制限される。
        # 実効レートは両者の厳しい方 = 既定では 1.0/s で、この 4.0/s は効かない。
        # rl で走らせるなら 4 基の max_duty_step_per_sec を上げること (docs 参照)
        thrust_slew_per_s: 4.0
        hold_yaw: true # false で yaw の保持だけ切る

  thruster_controller_lf: # Left Front Thruster
    ros__parameters:
      type: sinsei_umiusi_control/controller/ThrusterController
      update_rate: 50 # Hz
      id: 1 # ID of the thruster hardware component (`N` for `thrusterN` in the URDF)
      esc_disabled: false # Whether to disable ESC
      servo_disabled: false # Whether to disable servo
      is_forward: true # Thruster direction (true for forward, false for reverse)
      duty_per_thrust: 1.0 # Duty cycle per unit thrust [/N]
      max_duty: 0.5 # Maximum duty cycle (0.0 to 1.0)
      max_duty_step_per_sec: 1.0 # Maximum change in duty cycle per second

  thruster_controller_lb: # Left Back Thruster
    ros__parameters:
      type: sinsei_umiusi_control/controller/ThrusterController
      update_rate: 50 # Hz
      id: 2 # ID of the thruster hardware component (`N` for `thrusterN` in the URDF)
      esc_disabled: false # Whether to disable ESC
      servo_disabled: false # Whether to disable servo
      is_forward: true # Thruster direction (true for forward, false for reverse)
      duty_per_thrust: 1.0 # Duty cycle per unit thrust [/N]
      max_duty: 0.5 # Maximum duty cycle (0.0 to 1.0)
      max_duty_step_per_sec: 1.0 # Maximum change in duty cycle per second

  thruster_controller_rb: # Right Back Thruster
    ros__parameters:
      type: sinsei_umiusi_control/controller/ThrusterController
      update_rate: 50 # Hz
      id: 3 # ID of the thruster hardware component (`N` for `thrusterN` in the URDF)
      esc_disabled: false # Whether to disable ESC
      servo_disabled: false # Whether to disable servo
      is_forward: true # Thruster direction (true for forward, false for reverse)
      duty_per_thrust: 1.0 # Duty cycle per unit thrust [/N]
      max_duty: 0.5 # Maximum duty cycle (0.0 to 1.0)
      max_duty_step_per_sec: 1.0 # Maximum change in duty cycle per second

  thruster_controller_rf: # Right Front Thruster
    ros__parameters:
      type: sinsei_umiusi_control/controller/ThrusterController
      update_rate: 50 # Hz
      id: 4 # ID of the thruster hardware component (`N` for `thrusterN` in the URDF)
      esc_disabled: false # Whether to disable ESC
      servo_disabled: false # Whether to disable servo
      is_forward: true # Thruster direction (true for forward, false for reverse)
      duty_per_thrust: 1.0 # Duty cycle per unit thrust [/N]
      max_duty: 0.5 # Maximum duty cycle (0.0 to 1.0)
      max_duty_step_per_sec: 1.0 # Maximum change in duty cycle per second
